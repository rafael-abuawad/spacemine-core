[project]
src = "src"
out = "out"
dot_env = ".env"
dependencies = ["snekmate"]

[networks.pyevm]
is_zksync = false

[networks.anvil]
url = "http://127.0.0.1:8545"
prompt_live = false
save_to_db = false
chain_id = 31337

[networks.sepolia]
url = "https://ethereum-sepolia-rpc.publicnode.com"
chain_id = 11155111

[networks.zksync-sepolia]
url = "https://sepolia.era.zksync.dev"
chain_id = 300
is_zksync = true
prompt_live = true

# Robinhood Chain (Arbitrum Orbit L2, ETH gas). Notes for Spacemine:
# - `block.number` is an estimate of the parent-chain block number and `blockhash`
#   is a sequencer-derived pseudo-random value, so SCV reveals trust the sequencer.
# - SCV uses only the native 256-block `blockhash` window (no EIP-2935).
# - Set CREDITS_ADDRESS (and TREASURY_ADDRESS, RENDERER_ADDRESS) in `.env` before deploying.
# - The public RPCs are rate-limited; use a provider URL (e.g. Alchemy) for real deploys.
[networks.robinhood-testnet]
url = "https://rpc.testnet.chain.robinhood.com"
chain_id = 46630
prompt_live = true
save_to_db = true
explorer_uri = "https://explorer.testnet.chain.robinhood.com"
explorer_type = "blockscout"

# TODO: Robinhood Chain mainnet. Fill in `url` and `chain_id` from the official docs
# (https://docs.robinhood.com/chain/connecting) once published there; third-party
# listings (Chainstack) report chain ID 4663, which is not yet confirmed officially.
[networks.robinhood]
url = "https://TODO_ROBINHOOD_MAINNET_RPC_URL"
chain_id = 0 # TODO: confirm mainnet chain ID
prompt_live = true
save_to_db = true

